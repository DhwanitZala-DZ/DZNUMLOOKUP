<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DZ//OSINT — Terminal</title>
<style>
  :root {
    --bg: #050805;
    --bg-panel: #0a0f0a;
    --bg-hover: #0f1a0f;
    --fg: #b8f5b8;
    --fg-dim: #4a7a4a;
    --fg-bright: #d8ffd8;
    --green: #00ff41;
    --green-glow: rgba(0, 255, 65, 0.35);
    --amber: #ffb000;
    --red: #ff3355;
    --cyan: #00d9ff;
    --border: rgba(0, 255, 65, 0.18);
    --border-bright: rgba(0, 255, 65, 0.45);
    --mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', 'Consolas', 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.55;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* subtle radial vignette */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(0, 255, 65, 0.06), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* scanlines */
  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.15) 0px,
      rgba(0, 0, 0, 0.15) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
    mix-blend-mode: multiply;
  }

  /* ── header ─────────────────────────────────── */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(5, 8, 5, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .logo {
    font-size: 15px;
    font-weight: 700;
    color: var(--green);
    text-shadow: 0 0 8px var(--green-glow);
    letter-spacing: 0.05em;
    user-select: none;
  }
  .logo .slash { color: var(--fg-dim); margin: 0 2px; }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green-glow);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .status-pill {
    font-size: 11px;
    color: var(--fg-dim);
    letter-spacing: 0.1em;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .header-spacer { flex: 1; }

  .hdr-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg-dim);
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 10px;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: all 0.15s;
  }
  .hdr-btn:hover {
    border-color: var(--green);
    color: var(--green);
    box-shadow: 0 0 8px var(--green-glow);
  }

  /* ── layout ──────────────────────────────────── */
  main {
    position: relative;
    z-index: 1;
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }

  /* ── type tabs ───────────────────────────────── */
  .type-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .type-tab {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--fg-dim);
    padding: 10px 12px;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
    text-align: left;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  .type-tab .tt-label {
    display: block;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.1em;
    color: var(--fg);
    margin-bottom: 2px;
  }
  .type-tab .tt-desc {
    display: block;
    font-size: 10px;
    color: var(--fg-dim);
    letter-spacing: 0.02em;
  }
  .type-tab:hover {
    border-color: var(--border-bright);
    background: var(--bg-hover);
  }
  .type-tab.active {
    border-color: var(--green);
    background: rgba(0, 255, 65, 0.06);
    box-shadow: inset 0 0 20px rgba(0, 255, 65, 0.08), 0 0 12px rgba(0, 255, 65, 0.12);
  }
  .type-tab.active .tt-label { color: var(--green); text-shadow: 0 0 6px var(--green-glow); }
  .type-tab.active::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
  }

  /* ── input row ───────────────────────────────── */
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    padding: 0 12px;
    transition: border-color 0.15s;
  }
  .input-wrap:focus-within {
    border-color: var(--green);
    box-shadow: 0 0 12px var(--green-glow);
  }
  .input-prefix {
    color: var(--green);
    margin-right: 8px;
    font-weight: 700;
    user-select: none;
  }
  #queryInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg-bright);
    font-family: var(--mono);
    font-size: 14px;
    padding: 12px 0;
    letter-spacing: 0.02em;
  }
  #queryInput::placeholder { color: var(--fg-dim); opacity: 0.6; }

  .lookup-btn {
    background: var(--green);
    color: #050805;
    border: none;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.1em;
    padding: 0 22px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }
  .lookup-btn:hover:not(:disabled) {
    box-shadow: 0 0 20px var(--green-glow);
    transform: translateY(-1px);
  }
  .lookup-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* ── result panel ────────────────────────────── */
  .result-panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    min-height: 120px;
    position: relative;
  }
  .panel-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: rgba(0, 255, 65, 0.03);
    flex-wrap: wrap;
  }
  .panel-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--green);
    letter-spacing: 0.15em;
    text-shadow: 0 0 6px var(--green-glow);
  }
  .meta-chip {
    font-size: 10px;
    padding: 3px 8px;
    border: 1px solid var(--border);
    color: var(--fg-dim);
    letter-spacing: 0.05em;
    white-space: nowrap;
  }
  .meta-chip.ok { border-color: var(--green); color: var(--green); }
  .meta-chip.warn { border-color: var(--amber); color: var(--amber); }
  .meta-chip.err { border-color: var(--red); color: var(--red); }
  .meta-chip.cache { border-color: var(--cyan); color: var(--cyan); }

  .panel-body {
    padding: 16px;
  }

  /* empty state */
  .empty-state {
    padding: 48px 20px;
    text-align: center;
    color: var(--fg-dim);
    font-size: 12px;
    letter-spacing: 0.05em;
  }
  .empty-state .big {
    font-size: 28px;
    margin-bottom: 12px;
    color: var(--border-bright);
    opacity: 0.4;
  }

  /* loading */
  .loading-state {
    padding: 48px 20px;
    text-align: center;
    color: var(--green);
    font-size: 12px;
    letter-spacing: 0.1em;
  }
  .loading-bar {
    width: 240px;
    height: 2px;
    background: var(--border);
    margin: 16px auto 0;
    position: relative;
    overflow: hidden;
  }
  .loading-bar::after {
    content: '';
    position: absolute;
    inset: 0;
    width: 40%;
    background: var(--green);
    box-shadow: 0 0 12px var(--green);
    animation: scan 1.2s ease-in-out infinite;
  }
  @keyframes scan {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  /* error */
  .error-box {
    background: rgba(255, 51, 85, 0.06);
    border: 1px solid rgba(255, 51, 85, 0.4);
    padding: 14px 16px;
    color: #ff8899;
    font-size: 12px;
    line-height: 1.6;
  }
  .error-box .err-title {
    font-weight: 700;
    color: var(--red);
    letter-spacing: 0.1em;
    font-size: 11px;
    margin-bottom: 6px;
  }

  /* consensus banner */
  .consensus {
    background: rgba(0, 217, 255, 0.06);
    border: 1px solid rgba(0, 217, 255, 0.35);
    padding: 12px 14px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .consensus .c-label {
    font-size: 10px;
    color: var(--cyan);
    letter-spacing: 0.15em;
    font-weight: 700;
  }
  .consensus .c-value {
    font-size: 16px;
    color: var(--fg-bright);
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
  }
  .consensus .c-value:hover { color: var(--cyan); text-shadow: 0 0 8px rgba(0, 217, 255, 0.5); }
  .consensus .c-votes {
    font-size: 10px;
    color: var(--fg-dim);
    margin-left: auto;
  }

  /* record card */
  .record {
    border: 1px solid var(--border);
    margin-bottom: 12px;
    background: rgba(0, 0, 0, 0.3);
  }
  .record:last-child { margin-bottom: 0; }
  .record-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: rgba(0, 255, 65, 0.03);
    flex-wrap: wrap;
  }
  .record-badge {
    font-size: 10px;
    padding: 2px 8px;
    background: var(--green);
    color: #050805;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .record-source {
    font-size: 10px;
    color: var(--cyan);
    letter-spacing: 0.08em;
    border: 1px solid rgba(0, 217, 255, 0.35);
    padding: 2px 8px;
  }
  .record-copy {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg-dim);
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 10px;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: all 0.15s;
  }
  .record-copy:hover { border-color: var(--green); color: var(--green); }

  .fields {
    display: grid;
    grid-template-columns: minmax(110px, max-content) 1fr;
    gap: 0;
  }
  .field {
    display: contents;
  }
  .field-key {
    padding: 8px 12px;
    color: var(--fg-dim);
    font-size: 11px;
    letter-spacing: 0.05em;
    border-bottom: 1px solid rgba(0, 255, 65, 0.06);
    border-right: 1px solid rgba(0, 255, 65, 0.06);
    text-transform: uppercase;
    word-break: break-all;
  }
  .field-val {
    padding: 8px 12px;
    color: var(--fg-bright);
    font-size: 12px;
    border-bottom: 1px solid rgba(0, 255, 65, 0.06);
    word-break: break-all;
    cursor: pointer;
    transition: background 0.12s;
    position: relative;
  }
  .field-val:hover {
    background: rgba(0, 255, 65, 0.05);
  }
  .field-val:hover::after {
    content: '⊕ copy';
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 9px;
    color: var(--green);
    opacity: 0.7;
    letter-spacing: 0.05em;
  }
  .field.priority .field-key { color: var(--green); }
  .field.priority .field-val {
    color: var(--fg-bright);
    font-weight: 700;
    font-size: 14px;
    text-shadow: 0 0 6px rgba(0, 255, 65, 0.25);
  }
  .field-val.arr {
    color: var(--fg-dim);
    font-style: italic;
    cursor: default;
  }
  .field-val.arr:hover { background: transparent; }
  .field-val.arr:hover::after { content: ''; }

  /* raw json */
  .raw-section {
    margin-top: 14px;
    border: 1px solid var(--border);
    background: rgba(0, 0, 0, 0.3);
  }
  .raw-head {
    display: flex;
    align-items: center;
    padding: 8px 12px;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid var(--border);
    background: rgba(0, 255, 65, 0.03);
  }
  .raw-head:hover { background: rgba(0, 255, 65, 0.06); }
  .raw-title {
    font-size: 11px;
    color: var(--green);
    letter-spacing: 0.12em;
    font-weight: 700;
  }
  .raw-toggle {
    margin-left: auto;
    font-size: 10px;
    color: var(--fg-dim);
    letter-spacing: 0.05em;
  }
  .raw-body {
    display: none;
    padding: 12px 14px;
    max-height: 480px;
    overflow: auto;
  }
  .raw-section.open .raw-body { display: block; }
  .raw-body pre {
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.5;
    color: var(--fg);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .j-key { color: var(--cyan); }
  .j-str { color: var(--green); }
  .j-num { color: var(--amber); }
  .j-bool { color: #ff79c6; }
  .j-null { color: var(--fg-dim); font-style: italic; }

  /* broker strip */
  .broker-strip {
    margin-top: 12px;
    padding: 10px 12px;
    border: 1px dashed var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    font-size: 10px;
    color: var(--fg-dim);
    letter-spacing: 0.04em;
  }
  .broker-strip .bk-item { white-space: nowrap; }
  .broker-strip .bk-item b { color: var(--fg); font-weight: 400; }

  /* ── history ─────────────────────────────────── */
  .history-section {
    margin-top: 32px;
    border-top: 1px solid var(--border);
    padding-top: 20px;
  }
  .section-title {
    font-size: 11px;
    color: var(--green);
    letter-spacing: 0.15em;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .history-list { display: flex; flex-direction: column; gap: 4px; }
  .history-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    background: var(--bg-panel);
    cursor: pointer;
    transition: all 0.12s;
    font-size: 11px;
  }
  .history-item:hover {
    border-color: var(--border-bright);
    background: var(--bg-hover);
  }
  .hi-type {
    color: var(--green);
    font-weight: 700;
    letter-spacing: 0.08em;
    min-width: 55px;
  }
  .hi-query {
    color: var(--fg-bright);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .hi-time {
    color: var(--fg-dim);
    font-size: 10px;
    white-space: nowrap;
  }
  .hi-status {
    font-size: 9px;
    padding: 2px 6px;
    letter-spacing: 0.05em;
  }
  .hi-status.ok { color: var(--green); border: 1px solid rgba(0, 255, 65, 0.3); }
  .hi-status.err { color: var(--red); border: 1px solid rgba(255, 51, 85, 0.3); }
  .history-empty {
    color: var(--fg-dim);
    font-size: 11px;
    padding: 16px;
    text-align: center;
    border: 1px dashed var(--border);
  }

  /* ── toast ───────────────────────────────────── */
  #toastContainer {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 10000;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    background: var(--bg-panel);
    border: 1px solid var(--green);
    color: var(--green);
    padding: 10px 16px;
    font-size: 11px;
    letter-spacing: 0.06em;
    box-shadow: 0 0 20px var(--green-glow);
    animation: toastIn 0.2s ease-out;
    pointer-events: auto;
  }
  .toast.err { border-color: var(--red); color: var(--red); box-shadow: 0 0 20px rgba(255, 51, 85, 0.3); }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* ── scrollbar ───────────────────────────────── */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb {
    background: var(--border-bright);
    border-radius: 0;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--green); }

  /* ── responsive ──────────────────────────────── */
  @media (max-width: 720px) {
    .type-tabs { grid-template-columns: repeat(2, 1fr); }
    .input-row { flex-direction: column; }
    .lookup-btn { padding: 12px; }
    .fields { grid-template-columns: 1fr; }
    .field-key { border-right: none; padding-bottom: 2px; }
    .field-val { padding-top: 4px; }
  }
</style>
</head>
<body>
<div class="scanlines"></div>

<header>
  <div class="status-dot"></div>
  <div class="logo">DZ<span class="slash">//</span>OSINT</div>
  <div class="status-pill">TERMINAL v1.0 · CONNECTED</div>
  <div class="header-spacer"></div>
  <button class="hdr-btn" id="btnExportHistory" title="Download all history as JSON">EXPORT</button>
  <button class="hdr-btn" id="btnClearCache" title="Clear localStorage cache + history">PURGE</button>
</header>

<main>
  <div class="type-tabs" id="typeTabs"></div>

  <div class="input-row">
    <div class="input-wrap">
      <span class="input-prefix">&gt;</span>
      <input id="queryInput" type="text" placeholder="enter query..." autocomplete="off" spellcheck="false">
    </div>
    <button class="lookup-btn" id="lookupBtn">LOOKUP</button>
  </div>

  <div class="result-panel" id="resultPanel">
    <div class="panel-header">
      <span class="panel-title">RESULT</span>
      <span class="meta-chip" id="metaType">—</span>
      <span class="meta-chip" id="metaQuery">—</span>
      <span class="meta-chip" id="metaCredits" style="display:none"></span>
      <span class="meta-chip" id="metaTime" style="display:none"></span>
      <span class="meta-chip cache" id="metaChecked" style="display:none"></span>
    </div>
    <div class="panel-body" id="panelBody">
      <div class="empty-state">
        <div class="big">[ ]</div>
        awaiting input... pick a type, enter a query, hit LOOKUP
      </div>
    </div>
  </div>

  <div class="history-section">
    <div class="section-title">RECENT LOOKUPS</div>
    <div class="history-list" id="historyList">
      <div class="history-empty">no history yet</div>
    </div>
  </div>
</main>

<div id="toastContainer"></div>

<script>
(function () {
  'use strict';

  // ── config ────────────────────────────────────────────────
  const API_BASE = 'https://dz-osint.vercel.app';

  const TYPES = {
    num:    { label: 'NUM',    desc: 'phone lookup',           ph: '9997774567',  endpoint: '/num',    pattern: /^\d{6,}$/,  upper: false },
    tg:     { label: 'TG',     desc: 'telegram id → number',   ph: '7871967159',  endpoint: '/tg',     pattern: /^\d{6,}$/,  upper: false },
    veh:    { label: 'VEH',    desc: 'vehicle → mobile',       ph: 'GJ27AF8582',  endpoint: '/veh',    pattern: /^[A-Z0-9]{6,}$/, upper: true },
    aadhar: { label: 'AADHAR', desc: 'aadhaar → info',         ph: '862587803506',endpoint: '/aadhar', pattern: /^\d{6,}$/,  upper: false },
  };

  const PRIORITY_FIELDS = {
    num:    ['number', 'name', 'address', 'circle', 'alt'],
    tg:     ['number', 'country', 'country_code', 'tg_id'],
    veh:    ['mobile_number', 'vehicle_number', 'source'],
    aadhar: ['name', 'fname', 'num', 'alt', 'circle', 'aadhar', 'address'],
  };

  const CACHE_KEY   = 'dz_osint_cache_v1';
  const HISTORY_KEY = 'dz_osint_history_v1';
  const HISTORY_MAX = 50;

  // ── state ─────────────────────────────────────────────────
  let currentType = 'num';
  let loading = false;

  // ── dom refs ──────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const typeTabsEl   = $('typeTabs');
  const queryInput   = $('queryInput');
  const lookupBtn    = $('lookupBtn');
  const panelBody    = $('panelBody');
  const metaType     = $('metaType');
  const metaQuery    = $('metaQuery');
  const metaCredits  = $('metaCredits');
  const metaTime     = $('metaTime');
  const metaChecked  = $('metaChecked');
  const historyList  = $('historyList');
  const toastCont    = $('toastContainer');

  // ── utils ─────────────────────────────────────────────────
  function toast(msg, isErr) {
    const el = document.createElement('div');
    el.className = 'toast' + (isErr ? ' err' : '');
    el.textContent = msg;
    toastCont.appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity 0.2s, transform 0.2s';
      el.style.opacity = '0';
      el.style.transform = 'translateX(20px)';
      setTimeout(() => el.remove(), 220);
    }, 2200);
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        return true;
      } catch {
        return false;
      }
    }
  }

  function fmtDate(ts) {
    const d = new Date(ts);
    const pad = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
         + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function timeAgo(ts) {
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 60) return diff + 's ago';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return Math.floor(diff / 86400) + 'd ago';
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── localStorage ──────────────────────────────────────────
  function readCache() {
    try { return JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); }
    catch { return {}; }
  }
  function writeCache(c) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(c)); } catch {}
  }
  function readHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
    catch { return []; }
  }
  function writeHistory(h) {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(0, HISTORY_MAX))); } catch {}
  }

  function cacheKey(type, query) { return type + ':' + query.toLowerCase(); }

  // ── render: type tabs ─────────────────────────────────────
  function renderTabs() {
    typeTabsEl.innerHTML = Object.entries(TYPES).map(([k, v]) =>
      '<button class="type-tab' + (k === currentType ? ' active' : '') + '" data-type="' + k + '">'
      + '<span class="tt-label">' + v.label + '</span>'
      + '<span class="tt-desc">' + v.desc + '</span>'
      + '</button>'
    ).join('');
    typeTabsEl.querySelectorAll('.type-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        currentType = btn.dataset.type;
        renderTabs();
        queryInput.placeholder = TYPES[currentType].ph;
        queryInput.focus();
      });
    });
  }

  // ── render: meta chips ────────────────────────────────────
  function resetMeta() {
    metaType.textContent = '—';
    metaQuery.textContent = '—';
    metaCredits.style.display = 'none';
    metaTime.style.display = 'none';
    metaChecked.style.display = 'none';
  }

  function updateMeta(data, query, cachedTs) {
    metaType.textContent = data.type || TYPES[currentType].endpoint.slice(1);
    metaQuery.textContent = 'q=' + query;

    if (data.credits_left != null) {
      metaCredits.style.display = '';
      metaCredits.textContent = 'credits ' + data.credits_left;
      metaCredits.className = 'meta-chip' + (data.credits_left < 50 ? ' warn' : ' ok');
    }
    const rt = (data.broker && (data.broker.response_time || data.broker.response_time_seconds)) || null;
    if (rt != null) {
      metaTime.style.display = '';
      metaTime.textContent = 't=' + rt;
    }
    if (cachedTs) {
      metaChecked.style.display = '';
      metaChecked.textContent = 'CACHED · ' + fmtDate(cachedTs) + ' · ' + timeAgo(cachedTs);
    } else {
      metaChecked.style.display = 'none';
    }
  }

  // ── render: generic value ─────────────────────────────────
  function renderValue(v) {
    if (v == null) return '<span class="j-null">null</span>';
    if (typeof v === 'string') return escHtml(v);
    if (typeof v === 'number' || typeof v === 'boolean') return escHtml(String(v));
    if (Array.isArray(v)) return '<span class="arr">[' + v.length + ' items]</span>';
    if (typeof v === 'object') return '<span class="arr">{' + Object.keys(v).length + ' keys}</span>';
    return escHtml(String(v));
  }

  function rawValue(v) {
    if (v == null) return '';
    if (typeof v === 'string') return v;
    if (typeof v === 'number' || typeof v === 'boolean') return String(v);
    try { return JSON.stringify(v); } catch { return String(v); }
  }

  // ── render: record card ───────────────────────────────────
  function renderRecord(rec, idx, total) {
    if (!rec || typeof rec !== 'object') {
      return '<div class="record"><div class="fields">'
        + '<div class="field"><div class="field-key">value</div>'
        + '<div class="field-val" data-copy="' + escHtml(rawValue(rec)) + '">' + renderValue(rec) + '</div></div></div></div>';
    }

    const priority = PRIORITY_FIELDS[currentType] || [];
    const keys = Object.keys(rec);
    // sort: priority keys first in declared order, then the rest alphabetical
    keys.sort((a, b) => {
      const ia = priority.indexOf(a), ib = priority.indexOf(b);
      if (ia !== -1 && ib !== -1) return ia - ib;
      if (ia !== -1) return -1;
      if (ib !== -1) return 1;
      return a.localeCompare(b);
    });

    const rows = keys.map(k => {
      const isPriority = priority.includes(k);
      const raw = rawValue(rec[k]);
      const isComplex = rec[k] && typeof rec[k] === 'object';
      return '<div class="field' + (isPriority ? ' priority' : '') + '">'
        + '<div class="field-key">' + escHtml(k) + '</div>'
        + '<div class="field-val' + (isComplex ? ' arr' : '') + '"'
        + (isComplex ? '' : ' data-copy="' + escHtml(raw) + '"')
        + '>' + renderValue(rec[k]) + '</div>'
        + '</div>';
    }).join('');

    const sourceBadge = rec.source
      ? '<span class="record-source">' + escHtml(rec.source) + '</span>'
      : '';
    const label = total > 1 ? 'RECORD ' + (idx + 1) + '/' + total : 'RECORD';
    const recJson = escHtml(JSON.stringify(rec, null, 2));

    return '<div class="record">'
      + '<div class="record-head">'
      + '<span class="record-badge">' + label + '</span>'
      + sourceBadge
      + '<button class="record-copy" data-copy-btn="' + recJson + '">COPY JSON</button>'
      + '</div>'
      + '<div class="fields">' + rows + '</div>'
      + '</div>';
  }

  // ── render: consensus ─────────────────────────────────────
  function renderConsensus(c) {
    if (!c || !c.mobile_number) return '';
    const label = c.unanimous ? 'CONSENSUS · UNANIMOUS' : 'CONSENSUS';
    return '<div class="consensus">'
      + '<span class="c-label">' + label + '</span>'
      + '<span class="c-value" data-copy="' + escHtml(c.mobile_number) + '">' + escHtml(c.mobile_number) + '</span>'
      + '<span class="c-votes">' + c.votes + '/' + c.sources_total + ' sources agree</span>'
      + '</div>';
  }

  // ── render: broker strip ──────────────────────────────────
  function renderBroker(broker) {
    if (!broker || !Object.keys(broker).length) return '';
    const items = Object.entries(broker).map(([k, v]) =>
      '<span class="bk-item">' + escHtml(k) + ': <b>' + escHtml(rawValue(v)) + '</b></span>'
    ).join('');
    return '<div class="broker-strip">' + items + '</div>';
  }

  // ── render: raw JSON ──────────────────────────────────────
  function highlightJson(obj) {
    let json = JSON.stringify(obj, null, 2);
    json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return json.replace(
      /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
      function (m) {
        let cls = 'j-num';
        if (/^"/.test(m)) {
          cls = /:$/.test(m) ? 'j-key' : 'j-str';
        } else if (/true|false/.test(m)) cls = 'j-bool';
        else if (/null/.test(m)) cls = 'j-null';
        return '<span class="' + cls + '">' + m + '</span>';
      }
    );
  }

  function renderRaw(data) {
    const html = escHtml(JSON.stringify(data, null, 2));
    const fullJson = escHtml(JSON.stringify(data, null, 2));
    return '<div class="raw-section" id="rawSection">'
      + '<div class="raw-head" id="rawHead">'
      + '<span class="raw-title">RAW RESPONSE</span>'
      + '<button class="record-copy" style="margin-left:auto;margin-right:10px" data-copy-btn="' + fullJson + '">COPY ALL</button>'
      + '<span class="raw-toggle">[ expand ]</span>'
      + '</div>'
      + '<div class="raw-body"><pre>' + highlightJson(data) + '</pre></div>'
      + '</div>';
  }

  // ── render: error ─────────────────────────────────────────
  function renderError(err, status, extra) {
    let html = '<div class="error-box">'
      + '<div class="err-title">✕ REQUEST FAILED</div>'
      + escHtml(err || 'unknown error');
    if (status) html += '<br><br><span style="color:var(--fg-dim)">HTTP status: ' + escHtml(String(status)) + '</span>';
    if (extra) html += '<br><span style="color:var(--fg-dim)">' + escHtml(extra) + '</span>';
    html += '</div>';
    return html;
  }

  // ── render: full result ───────────────────────────────────
  function renderResult(data, query, cachedTs) {
    let html = '';

    if (data.consensus) html += renderConsensus(data.consensus);

    // records: prefer array; fall back to single record
    let records = [];
    if (Array.isArray(data.records) && data.records.length) records = data.records;
    else if (data.record) records = [data.record];

    if (records.length) {
      html += records.map((r, i) => renderRecord(r, i, records.length)).join('');
    } else if (data.ok && !data.error) {
      html += '<div class="empty-state"><div class="big">∅</div>no records returned for this query</div>';
    }

    if (data.broker) html += renderBroker(data.broker);

    if (data.error) {
      html += '<div style="margin-top:12px">'
        + renderError(data.error, data.ok === false ? 402 : null, null)
        + '</div>';
    }

    html += renderRaw(data);
    return html;
  }

  // ── copy delegation ───────────────────────────────────────
  document.addEventListener('click', async (e) => {
    const t = e.target;
    if (!(t instanceof HTMLElement)) return;

    // value cell copy
    const copyEl = t.closest('[data-copy]');
    if (copyEl && !t.closest('[data-copy-btn]')) {
      const val = copyEl.getAttribute('data-copy');
      if (val) {
        const ok = await copyText(val);
        if (ok) toast('copied: ' + (val.length > 40 ? val.slice(0, 40) + '…' : val));
        else toast('copy failed', true);
      }
      return;
    }

    // explicit copy button
    const btn = t.closest('[data-copy-btn]');
    if (btn) {
      const val = btn.getAttribute('data-copy-btn');
      const ok = await copyText(val);
      if (ok) toast('copied to clipboard');
      else toast('copy failed', true);
      return;
    }
  });

  // raw section toggle (event delegation)
  document.addEventListener('click', (e) => {
    const head = e.target.closest('#rawHead');
    if (!head) return;
    const section = head.parentElement;
    section.classList.toggle('open');
    const tog = head.querySelector('.raw-toggle');
    if (tog) tog.textContent = section.classList.contains('open') ? '[ collapse ]' : '[ expand ]';
  });

  // ── lookup ────────────────────────────────────────────────
  async function doLookup(forceRefresh) {
    if (loading) return;
    const rawQuery = queryInput.value.trim();
    const cfg = TYPES[currentType];

    if (!rawQuery) {
      toast('enter a query first', true);
      queryInput.focus();
      return;
    }

    let query = cfg.upper ? rawQuery.toUpperCase() : rawQuery;
    if (!cfg.pattern.test(query)) {
      toast('invalid format for ' + cfg.label, true);
      panelBody.innerHTML = renderError(
        'query does not match expected format for ' + cfg.label,
        400,
        'expected pattern: ' + cfg.pattern.toString()
      );
      return;
    }

    const ck = cacheKey(currentType, query);
    const cache = readCache();

    // cache hit
    if (!forceRefresh && cache[ck]) {
      const entry = cache[ck];
      updateMeta(entry.data, query, entry.ts);
      panelBody.innerHTML = renderResult(entry.data, query, entry.ts);
      toast('loaded from cache · ' + timeAgo(entry.ts));
      return;
    }

    // loading state
    loading = true;
    lookupBtn.disabled = true;
    resetMeta();
    updateMeta({ type: cfg.endpoint.slice(1), credits_left: null }, query, null);
    metaType.textContent = cfg.label;
    panelBody.innerHTML = '<div class="loading-state">SCANNING ' + escHtml(cfg.label) + ' · ' + escHtml(query) + '<div class="loading-bar"></div></div>';

    const url = API_BASE + cfg.endpoint + '?q=' + encodeURIComponent(query);

    try {
      const res = await fetch(url, { method: 'GET', headers: { 'Accept': 'application/json' } });
      let data;
      try { data = await res.json(); }
      catch { throw new Error('upstream returned unparseable JSON (status ' + res.status + ')'); }

      if (!res.ok && !data.ok) {
        const msg = data.error || ('HTTP ' + res.status);
        metaType.textContent = cfg.label;
        updateMeta(data, query, null);
        panelBody.innerHTML = renderResult(data, query, null);
        toast('lookup failed: ' + msg, true);
        pushHistory(currentType, query, false, null);
        return;
      }

      // success — store + render
      const ts = Date.now();
      cache[ck] = { data, ts };
      writeCache(cache);

      updateMeta(data, query, null);
      panelBody.innerHTML = renderResult(data, query, null);
      toast('lookup complete · ' + (data.record_count != null ? data.record_count + ' record(s)' : 'ok'));

      const summary = summarize(data);
      pushHistory(currentType, query, true, summary);

    } catch (err) {
      const msg = err && err.message ? err.message : String(err);
      metaType.textContent = cfg.label;
      updateMeta({ type: cfg.endpoint.slice(1) }, query, null);
      panelBody.innerHTML = renderError(msg, null, 'check your network or the API may be down');
      toast('connection failed', true);
      pushHistory(currentType, query, false, null);
    } finally {
      loading = false;
      lookupBtn.disabled = false;
      queryInput.focus();
      queryInput.select();
    }
  }

  function summarize(data) {
    if (data.consensus && data.consensus.mobile_number) return data.consensus.mobile_number;
    if (data.record) {
      if (data.record.mobile_number) return data.record.mobile_number;
      if (data.record.number) return data.record.number;
      if (data.record.name) return data.record.name;
      if (data.record.tg_id) return data.record.tg_id;
    }
    return null;
  }

  // ── history ───────────────────────────────────────────────
  function pushHistory(type, query, ok, summary) {
    const h = readHistory();
    // remove duplicate of same type+query from front
    const filtered = h.filter(x => !(x.type === type && x.query === query));
    filtered.unshift({ type, query, ok, ts: Date.now(), summary });
    writeHistory(filtered);
    renderHistory();
  }

  function renderHistory() {
    const h = readHistory();
    if (!h.length) {
      historyList.innerHTML = '<div class="history-empty">no history yet</div>';
      return;
    }
    historyList.innerHTML = h.map((item, i) =>
      '<div class="history-item" data-hist-idx="' + i + '">'
      + '<span class="hi-type">' + escHtml(TYPES[item.type] ? TYPES[item.type].label : item.type) + '</span>'
      + '<span class="hi-query">' + escHtml(item.query) + (item.summary ? ' → ' + escHtml(item.summary) : '') + '</span>'
      + '<span class="hi-status ' + (item.ok ? 'ok' : 'err') + '">' + (item.ok ? 'OK' : 'ERR') + '</span>'
      + '<span class="hi-time">' + fmtDate(item.ts) + '</span>'
      + '</div>'
    ).join('');

    historyList.querySelectorAll('.history-item').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.histIdx, 10);
        const item = readHistory()[idx];
        if (!item) return;
        currentType = item.type;
        renderTabs();
        queryInput.placeholder = TYPES[currentType].ph;
        queryInput.value = item.query;
        doLookup(false);
      });
    });
  }

  // ── header buttons ────────────────────────────────────────
  $('btnClearCache').addEventListener('click', () => {
    if (!confirm('Purge local cache + history? This only clears your browser, not the server.')) return;
    localStorage.removeItem(CACHE_KEY);
    localStorage.removeItem(HISTORY_KEY);
    toast('local cache purged');
    renderHistory();
    resetMeta();
    panelBody.innerHTML = '<div class="empty-state"><div class="big">[ ]</div>cache cleared. ready for new queries.</div>';
  });

  $('btnExportHistory').addEventListener('click', () => {
    const h = readHistory();
    if (!h.length) { toast('no history to export', true); return; }
    const blob = new Blob([JSON.stringify(h, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'dz-osint-history-' + Date.now() + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('history exported');
  });

  // ── wire input + button ───────────────────────────────────
  lookupBtn.addEventListener('click', () => doLookup(true));
  queryInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); doLookup(true); }
    if (e.key === 'Escape') { queryInput.value = ''; }
  });

  // ── init ──────────────────────────────────────────────────
  renderTabs();
  renderHistory();
  queryInput.placeholder = TYPES[currentType].ph;
  queryInput.focus();

})();
</script>
</body>
</html>
