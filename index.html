<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>DZ//OSINT — Terminal</title>
<style>
  :root {
    --black: #000000;
    --panel: #080b08;
    --card: #0d120d;
    --border: rgba(0, 255, 136, 0.22);
    --border-hi: rgba(0, 255, 136, 0.6);
    --text: #ffffff;
    --text-2: #d8e4d8;
    --text-3: #8a9c8a;
    --green: #00ff88;
    --cyan: #00e5ff;
    --amber: #ffb300;
    --red: #ff3366;
    --purple: #b57bff;
    --mono: 'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',Consolas,'Courier New',monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 255, 136, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 136, 0.045) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(ellipse at center, black 25%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 25%, transparent 70%);
    animation: gridScroll 40s linear infinite;
  }
  @keyframes gridScroll {
    from { background-position: 0 0; }
    to { background-position: 48px 48px; }
  }

  .bg-glow {
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 600px;
    background: radial-gradient(ellipse, rgba(0, 255, 136, 0.14), transparent 70%);
    filter: blur(60px);
    pointer-events: none;
    z-index: 0;
    animation: glowPulse 6s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.18) 0px,
      rgba(0, 0, 0, 0.18) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 9998;
    opacity: 0.4;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.9);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }

  .logo {
    font-size: 17px;
    font-weight: 800;
    color: var(--green);
    letter-spacing: 0.06em;
    text-shadow: 0 0 14px rgba(0, 255, 136, 0.7);
    user-select: none;
  }
  .logo .slash { color: var(--text-3); margin: 0 3px; font-weight: 400; }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 12px var(--green);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  .clock {
    font-size: 12px;
    color: var(--green);
    letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 6px rgba(0, 255, 136, 0.5);
  }

  .header-spacer { flex: 1; }

  .hdr-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-2);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    padding: 6px 12px;
    cursor: pointer;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: border-color 0.18s, color 0.18s, box-shadow 0.18s;
  }
  .hdr-btn:hover {
    border-color: var(--green);
    color: var(--green);
    box-shadow: 0 0 12px rgba(0, 255, 136, 0.35);
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 1280px;
    margin: 0 auto;
    padding: 28px 24px 100px;
  }

  .tabs {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 18px;
  }
  .tab {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-2);
    padding: 14px 16px;
    cursor: pointer;
    font-family: var(--mono);
    text-align: left;
    transition: background 0.18s, border-color 0.18s, box-shadow 0.18s;
    overflow: hidden;
    min-width: 0;
  }
  .tab::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--green);
    transition: all 0.2s;
  }
  .tab[data-type="tg"]::before     { background: var(--cyan); }
  .tab[data-type="veh"]::before    { background: var(--amber); }
  .tab[data-type="aadhar"]::before { background: var(--purple); }

  .tab .tt-label {
    display: block;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.14em;
    color: var(--text);
    margin-bottom: 3px;
  }
  .tab .tt-desc {
    display: block;
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .tab:hover {
    background: var(--card);
    border-color: var(--border-hi);
  }
  .tab.active {
    border-color: var(--green);
    background: var(--card);
    box-shadow: 0 0 0 1px var(--green), 0 0 24px rgba(0, 255, 136, 0.18);
  }
  .tab.active .tt-label { color: var(--green); }

  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
  }
  .input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 0 16px;
    transition: border-color 0.18s, box-shadow 0.18s;
    min-width: 0;
  }
  .input-wrap:focus-within {
    border-color: var(--green);
    box-shadow: 0 0 0 1px var(--green), 0 0 22px rgba(0, 255, 136, 0.25);
  }
  .prefix {
    color: var(--green);
    margin-right: 10px;
    font-weight: 800;
    font-size: 15px;
    user-select: none;
    text-shadow: 0 0 8px rgba(0, 255, 136, 0.6);
  }
  #queryInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    padding: 15px 0;
    letter-spacing: 0.02em;
    min-width: 0;
  }
  #queryInput::placeholder { color: var(--text-3); opacity: 0.8; }

  .lookup-btn {
    background: var(--green);
    color: #000;
    border: none;
    font-family: var(--mono);
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.14em;
    padding: 0 28px;
    cursor: pointer;
    transition: box-shadow 0.18s, transform 0.1s;
    text-transform: uppercase;
  }
  .lookup-btn:hover:not(:disabled) {
    box-shadow: 0 0 26px rgba(0, 255, 136, 0.7);
  }
  .lookup-btn:active:not(:disabled) { transform: scale(0.98); }
  .lookup-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    min-height: 140px;
    min-width: 0;
  }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: rgba(0, 255, 136, 0.03);
    flex-wrap: wrap;
  }
  .panel-title {
    font-size: 12px;
    font-weight: 800;
    color: var(--green);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-shadow: 0 0 8px rgba(0, 255, 136, 0.6);
  }

  .chip {
    font-size: 10px;
    font-weight: 700;
    padding: 4px 10px;
    border: 1px solid var(--border);
    color: var(--text-2);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .chip.ok { border-color: var(--green); color: var(--green); }
  .chip.warn { border-color: var(--amber); color: var(--amber); }
  .chip.err { border-color: var(--red); color: var(--red); }
  .chip.cache { border-color: var(--cyan); color: var(--cyan); }

  .panel-body {
    padding: 20px;
    min-width: 0;
    background: var(--panel);
    color: var(--text);
  }

  .empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-3);
    font-size: 13px;
    letter-spacing: 0.04em;
  }
  .empty .glyph {
    font-size: 42px;
    color: var(--border-hi);
    margin-bottom: 16px;
    display: block;
  }

  .loading {
    padding: 60px 20px;
    text-align: center;
  }
  .loading-text {
    color: var(--green);
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 20px;
    text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
  }
  .loading-bar {
    width: 280px;
    max-width: 80%;
    height: 3px;
    background: rgba(0, 255, 136, 0.12);
    margin: 0 auto;
    position: relative;
    overflow: hidden;
  }
  .loading-bar::after {
    content: '';
    position: absolute;
    inset: 0;
    width: 35%;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    animation: scan 1.4s ease-in-out infinite;
  }
  @keyframes scan {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(400%); }
  }

  .error-box {
    background: rgba(255, 51, 102, 0.06);
    border: 1px solid rgba(255, 51, 102, 0.45);
    border-left-width: 3px;
    padding: 16px 18px;
    color: #ffc0cc;
    font-size: 13px;
    line-height: 1.7;
  }
  .error-box .err-title {
    font-weight: 800;
    color: var(--red);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .consensus {
    background: linear-gradient(135deg, rgba(0, 229, 255, 0.08), rgba(0, 229, 255, 0.02));
    border: 1px solid rgba(0, 229, 255, 0.45);
    padding: 18px 22px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 22px;
    flex-wrap: wrap;
  }
  .c-label {
    font-size: 10px;
    color: var(--cyan);
    letter-spacing: 0.18em;
    font-weight: 800;
    text-transform: uppercase;
  }
  .c-value {
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: color 0.18s, text-shadow 0.18s;
    text-shadow: 0 0 16px rgba(0, 229, 255, 0.6);
  }
  .c-value:hover {
    color: var(--cyan);
    text-shadow: 0 0 24px rgba(0, 229, 255, 1);
  }
  .c-votes {
    font-size: 11px;
    color: var(--text-2);
    letter-spacing: 0.06em;
    margin-left: auto;
  }
  .c-unanimous { color: var(--green); font-weight: 800; }

  .records {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .record {
    background: var(--card);
    border: 1px solid var(--border);
    min-width: 0;
    transition: border-color 0.18s, box-shadow 0.18s;
    opacity: 1;
  }
  .record:hover {
    border-color: var(--border-hi);
    box-shadow: 0 4px 24px rgba(0, 255, 136, 0.08);
  }

  .record-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(0, 255, 136, 0.04);
    flex-wrap: wrap;
  }
  .badge {
    font-size: 10px;
    font-weight: 800;
    padding: 3px 10px;
    background: var(--green);
    color: #000;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .source-badge {
    font-size: 10px;
    font-weight: 700;
    color: var(--cyan);
    letter-spacing: 0.08em;
    border: 1px solid rgba(0, 229, 255, 0.45);
    padding: 3px 10px;
    text-transform: uppercase;
  }
  .copy-btn {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-2);
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    padding: 4px 12px;
    cursor: pointer;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: border-color 0.18s, color 0.18s, box-shadow 0.18s;
  }
  .copy-btn:hover {
    border-color: var(--green);
    color: var(--green);
    box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
  }
  .copy-btn.copied {
    border-color: var(--green);
    color: var(--green);
    background: rgba(0, 255, 136, 0.15);
  }

  /* ── field rows (flat, no display:contents) ── */
  .fields {
    display: flex;
    flex-direction: column;
  }
  .field-row {
    display: grid;
    grid-template-columns: minmax(120px, 170px) minmax(0, 1fr);
    border-bottom: 1px solid rgba(0, 255, 136, 0.1);
  }
  .field-row:last-child { border-bottom: none; }

  .field-key {
    padding: 13px 16px;
    background: rgba(0, 255, 136, 0.03);
    border-right: 1px solid rgba(0, 255, 136, 0.1);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-3);
    word-break: break-word;
    min-width: 0;
    display: flex;
    align-items: flex-start;
  }

  .field-val {
    padding: 13px 16px;
    padding-right: 42px;
    color: var(--text);
    background: transparent;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.65;
    overflow-wrap: anywhere;
    word-break: break-word;
    min-width: 0;
    position: relative;
    cursor: pointer;
    transition: background 0.15s;
  }
  .field-val:hover { background: rgba(0, 255, 136, 0.06); }
  .field-val::after {
    content: '⧉';
    position: absolute;
    right: 14px;
    top: 13px;
    color: var(--text-3);
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
    pointer-events: none;
  }
  .field-val:hover::after {
    opacity: 1;
    color: var(--green);
  }
  .field-val.copied {
    background: rgba(0, 255, 136, 0.18);
  }

  .field-row.priority .field-key {
    color: var(--green);
    font-weight: 800;
  }
  .field-row.priority .field-val {
    color: #ffffff;
    font-size: 17px;
    font-weight: 800;
    text-shadow: 0 0 14px rgba(0, 255, 136, 0.4);
  }

  .field-val.complex {
    cursor: default;
    color: var(--text-2);
    font-size: 13px;
  }
  .field-val.complex::after { content: none; }
  .field-val.complex:hover { background: transparent; }

  .arr-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 4px 0;
  }
  .arr-list li {
    padding-left: 22px;
    position: relative;
    color: var(--text-2);
    font-size: 13px;
    overflow-wrap: anywhere;
  }
  .arr-list li::before {
    content: '▸';
    position: absolute;
    left: 4px;
    color: var(--green);
    font-size: 11px;
  }
  .arr-list li .arr-idx {
    color: var(--text-3);
    font-size: 10px;
    margin-right: 6px;
    font-weight: 700;
  }

  .stats-strip {
    margin-top: 18px;
    padding: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 14px;
  }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .stat-label {
    font-size: 9px;
    color: var(--text-3);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .stat-value {
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
    line-height: 1.2;
  }
  .stat.accent .stat-value { color: var(--green); text-shadow: 0 0 12px rgba(0, 255, 136, 0.5); }
  .stat.warn .stat-value { color: var(--amber); }
  .stat.cyan .stat-value { color: var(--cyan); text-shadow: 0 0 12px rgba(0, 229, 255, 0.5); }

  .progress {
    width: 100%;
    height: 4px;
    background: rgba(0, 255, 136, 0.12);
    margin-top: 6px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .raw {
    margin-top: 18px;
    border: 1px solid var(--border);
    background: var(--card);
  }
  .raw-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
    flex-wrap: wrap;
  }
  .raw-head:hover { background: rgba(0, 255, 136, 0.05); }
  .raw-title {
    font-size: 11px;
    color: var(--green);
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .raw-toggle {
    margin-left: auto;
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .raw-body {
    display: none;
    max-height: 500px;
    overflow: auto;
    border-top: 1px solid var(--border);
  }
  .raw.open .raw-body { display: block; }
  .raw-body pre {
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.7;
    color: var(--text-2);
    padding: 16px 18px;
    white-space: pre;
    min-width: 100%;
  }
  .j-key { color: var(--cyan); }
  .j-str { color: var(--green); }
  .j-num { color: var(--amber); }
  .j-bool { color: var(--purple); }
  .j-null { color: var(--text-3); font-style: italic; }

  .history-sec {
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }
  .sec-title {
    font-size: 12px;
    color: var(--green);
    letter-spacing: 0.18em;
    font-weight: 800;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .sec-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--border), transparent);
  }
  .sec-title .count {
    font-size: 10px;
    color: var(--text-3);
    font-weight: 600;
  }

  .history-list { display: flex; flex-direction: column; gap: 6px; }

  .hist-item {
    display: grid;
    grid-template-columns: 70px minmax(0, 1fr) auto 60px auto;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    border: 1px solid var(--border);
    background: var(--panel);
    cursor: pointer;
    font-size: 12px;
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
    min-width: 0;
  }
  .hist-item:hover {
    border-color: var(--border-hi);
    background: var(--card);
    transform: translateX(4px);
  }

  .hist-type {
    color: var(--green);
    font-weight: 800;
    letter-spacing: 0.1em;
    font-size: 11px;
    text-transform: uppercase;
  }
  .hist-query {
    color: var(--text);
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .hist-query .arrow { color: var(--text-3); margin: 0 6px; }
  .hist-query .summary { color: var(--cyan); }
  .hist-status {
    font-size: 9px;
    padding: 3px 8px;
    letter-spacing: 0.1em;
    font-weight: 800;
    text-transform: uppercase;
  }
  .hist-status.ok { color: var(--green); border: 1px solid rgba(0, 255, 136, 0.4); }
  .hist-status.err { color: var(--red); border: 1px solid rgba(255, 51, 102, 0.4); }
  .hist-time {
    color: var(--text-3);
    font-size: 10px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .hist-del {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-3);
    cursor: pointer;
    padding: 3px 8px;
    font-family: var(--mono);
    font-size: 12px;
    transition: color 0.15s, border-color 0.15s, opacity 0.15s;
    opacity: 0;
  }
  .hist-item:hover .hist-del { opacity: 1; }
  .hist-del:hover {
    color: var(--red);
    border-color: rgba(255, 51, 102, 0.4);
  }

  .hist-empty {
    color: var(--text-3);
    font-size: 12px;
    padding: 32px 20px;
    text-align: center;
    border: 1px dashed var(--border);
    letter-spacing: 0.04em;
  }

  #toasts {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 10000;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
    max-width: calc(100vw - 48px);
  }
  .toast {
    background: #000;
    border: 1px solid var(--green);
    color: var(--green);
    padding: 12px 18px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    box-shadow: 0 0 24px rgba(0, 255, 136, 0.4), 0 8px 32px rgba(0, 0, 0, 0.9);
    pointer-events: auto;
    max-width: 360px;
    overflow-wrap: anywhere;
  }
  .toast.err {
    border-color: var(--red);
    color: var(--red);
    box-shadow: 0 0 24px rgba(255, 51, 102, 0.4), 0 8px 32px rgba(0, 0, 0, 0.9);
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--black); }
  ::-webkit-scrollbar-thumb {
    background: rgba(0, 255, 136, 0.35);
    border: 2px solid var(--black);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--green); }

  @media (max-width: 820px) {
    main { padding: 20px 14px 80px; }
    header { padding: 10px 14px; gap: 12px; }
    .clock { display: none; }
    .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 600px) {
    body { font-size: 13px; }
    .input-row { flex-direction: column; }
    .lookup-btn { padding: 14px; }
    .field-row {
      grid-template-columns: 1fr;
    }
    .field-key {
      border-right: none;
      border-bottom: none;
      padding: 12px 14px 2px;
    }
    .field-val {
      padding: 2px 14px 14px;
      padding-right: 40px;
    }
    .hist-item {
      grid-template-columns: 55px minmax(0, 1fr) auto;
      gap: 10px;
    }
    .hist-time, .hist-status { display: none; }
    .c-value { font-size: 20px; }
    .stat-value { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="scanlines"></div>

<header>
  <div class="logo">DZ<span class="slash">//</span>OSINT</div>
  <div class="status">
    <span class="status-dot"></span>
    ONLINE
  </div>
  <div class="clock" id="clock">--:--:--</div>
  <div class="header-spacer"></div>
  <button class="hdr-btn" id="btnExport">EXPORT</button>
  <button class="hdr-btn" id="btnPurge">PURGE</button>
</header>

<main>
  <div class="tabs" id="tabs"></div>

  <div class="input-row">
    <div class="input-wrap">
      <span class="prefix">&gt;</span>
      <input id="queryInput" type="text" placeholder="enter query..." autocomplete="off" spellcheck="false">
    </div>
    <button class="lookup-btn" id="lookupBtn">LOOKUP</button>
  </div>

  <div class="panel" id="panel">
    <div class="panel-header">
      <span class="panel-title">RESULT</span>
      <span class="chip" id="chipType">—</span>
      <span class="chip" id="chipQuery">—</span>
      <span class="chip ok" id="chipCredits" style="display:none"></span>
      <span class="chip" id="chipTime" style="display:none"></span>
      <span class="chip cache" id="chipCache" style="display:none"></span>
    </div>
    <div class="panel-body" id="panelBody">
      <div class="empty">
        <span class="glyph">[ ]</span>
        awaiting input — pick a type, enter a query, hit LOOKUP
      </div>
    </div>
  </div>

  <section class="history-sec">
    <div class="sec-title">Recent Lookups <span class="count" id="histCount"></span></div>
    <div class="history-list" id="histList">
      <div class="hist-empty">no history yet</div>
    </div>
  </section>
</main>

<div id="toasts"></div>

<script>
(function () {
  'use strict';

  const API = 'https://dz-osint.vercel.app';

  const TYPES = {
    num:    { label: 'NUM',    desc: 'Phone',    ph: '9997774567',   ep: '/num',    pattern: /^\d{6,}$/,       upper: false },
    tg:     { label: 'TG',     desc: 'Telegram', ph: '7871967159',   ep: '/tg',     pattern: /^\d{6,}$/,       upper: false },
    veh:    { label: 'VEH',    desc: 'Vehicle',  ph: 'GJ27AF8582',   ep: '/veh',    pattern: /^[A-Z0-9]{6,}$/, upper: true  },
    aadhar: { label: 'AADHAR', desc: 'Aadhaar',  ph: '862587803506', ep: '/aadhar', pattern: /^\d{6,}$/,       upper: false },
  };

  const PRIORITY = {
    num:    ['number', 'name', 'circle', 'alt', 'address'],
    tg:     ['number', 'country', 'country_code', 'tg_id'],
    veh:    ['mobile_number', 'vehicle_number', 'source'],
    aadhar: ['name', 'fname', 'num', 'alt', 'circle', 'aadhar', 'address'],
  };

  const CK = 'dz_v3_cache';
  const HK = 'dz_v3_history';
  const HMAX = 100;

  let currentType = 'num';
  let loading = false;

  const $ = id => document.getElementById(id);
  const tabsEl = $('tabs'), inputEl = $('queryInput'), btnEl = $('lookupBtn');
  const panelBody = $('panelBody'), histList = $('histList'), histCount = $('histCount');
  const chipType = $('chipType'), chipQuery = $('chipQuery'), chipCredits = $('chipCredits');
  const chipTime = $('chipTime'), chipCache = $('chipCache');
  const toastsEl = $('toasts'), clockEl = $('clock');

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function fmt(ts) {
    const d = new Date(ts), p = n => String(n).padStart(2,'0');
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  }

  function ago(ts) {
    const s = Math.floor((Date.now()-ts)/1000);
    if (s < 60) return s+'s ago';
    if (s < 3600) return Math.floor(s/60)+'m ago';
    if (s < 86400) return Math.floor(s/3600)+'h ago';
    return Math.floor(s/86400)+'d ago';
  }

  function toast(msg, err) {
    const el = document.createElement('div');
    el.className = 'toast' + (err ? ' err' : '');
    el.textContent = msg;
    toastsEl.appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity 0.25s, transform 0.25s';
      el.style.opacity = '0';
      el.style.transform = 'translateX(30px)';
      setTimeout(() => el.remove(), 260);
    }, 2400);
  }

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;left:-9999px;top:0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        return true;
      } catch { return false; }
    }
  }

  const readCache = () => { try { return JSON.parse(localStorage.getItem(CK)||'{}'); } catch { return {}; } };
  const writeCache = c => { try { localStorage.setItem(CK, JSON.stringify(c)); } catch {} };
  const readHist = () => { try { return JSON.parse(localStorage.getItem(HK)||'[]'); } catch { return []; } };
  const writeHist = h => { try { localStorage.setItem(HK, JSON.stringify(h.slice(0,HMAX))); } catch {} };
  const cKey = (t,q) => t+':'+q.toLowerCase();

  function tick() {
    const d = new Date(), p = n => String(n).padStart(2,'0');
    clockEl.textContent = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  }
  setInterval(tick, 1000); tick();

  function renderTabs() {
    tabsEl.innerHTML = Object.entries(TYPES).map(([k,v]) =>
      '<button class="tab'+(k===currentType?' active':'')+'" data-type="'+k+'">'
      + '<span class="tt-label">'+v.label+'</span>'
      + '<span class="tt-desc">'+v.desc+'</span>'
      + '</button>'
    ).join('');
    tabsEl.querySelectorAll('.tab').forEach(b => {
      b.addEventListener('click', () => {
        currentType = b.dataset.type;
        renderTabs();
        inputEl.placeholder = TYPES[currentType].ph;
        inputEl.focus();
      });
    });
  }

  function resetChips() {
    chipType.textContent = '—';
    chipQuery.textContent = '—';
    chipCredits.style.display = 'none';
    chipTime.style.display = 'none';
    chipCache.style.display = 'none';
  }

  function updateChips(data, query, cacheTs) {
    chipType.textContent = data.type || TYPES[currentType].ep.slice(1);
    chipQuery.textContent = 'q=' + query;
    if (data.credits_left != null) {
      chipCredits.style.display = '';
      chipCredits.textContent = 'credits ' + data.credits_left;
      chipCredits.className = 'chip' + (data.credits_left < 50 ? ' warn' : ' ok');
    }
    const rt = data.broker && (data.broker.response_time || data.broker.response_time_seconds);
    if (rt != null) {
      chipTime.style.display = '';
      chipTime.textContent = 't=' + rt;
    }
    if (cacheTs) {
      chipCache.style.display = '';
      chipCache.textContent = '⚡ cached · ' + ago(cacheTs);
    } else {
      chipCache.style.display = 'none';
    }
  }

  function renderValue(v) {
    if (v == null) return '<span class="j-null">null</span>';
    if (typeof v === 'string') return esc(v);
    if (typeof v === 'number') return esc(String(v));
    if (typeof v === 'boolean') return esc(String(v));
    if (Array.isArray(v)) {
      if (!v.length) return '<span class="j-null">[]</span>';
      return '<ul class="arr-list">' + v.map((x,i) =>
        '<li><span class="arr-idx">['+i+']</span>' + renderValue(x) + '</li>'
      ).join('') + '</ul>';
    }
    if (typeof v === 'object') {
      const keys = Object.keys(v);
      if (!keys.length) return '<span class="j-null">{}</span>';
      return '<ul class="arr-list">' + keys.map(k =>
        '<li><span class="arr-idx">'+esc(k)+':</span>' + renderValue(v[k]) + '</li>'
      ).join('') + '</ul>';
    }
    return esc(String(v));
  }

  function rawVal(v) {
    if (v == null) return '';
    if (typeof v === 'string') return v;
    if (typeof v === 'number' || typeof v === 'boolean') return String(v);
    try { return JSON.stringify(v); } catch { return String(v); }
  }

  function isComplex(v) { return v && typeof v === 'object'; }

  function renderRecord(rec, idx, total) {
    if (!rec || typeof rec !== 'object') {
      return '<div class="record"><div class="fields">'
        + '<div class="field-row"><div class="field-key">value</div>'
        + '<div class="field-val" data-copy="'+esc(rawVal(rec))+'">' + renderValue(rec) + '</div>'
        + '</div></div></div>';
    }

    const prio = PRIORITY[currentType] || [];
    const keys = Object.keys(rec).sort((a,b) => {
      const ia = prio.indexOf(a), ib = prio.indexOf(b);
      if (ia !== -1 && ib !== -1) return ia - ib;
      if (ia !== -1) return -1;
      if (ib !== -1) return 1;
      return a.localeCompare(b);
    });

    const rows = keys.map(k => {
      const isP = prio.includes(k);
      const complex = isComplex(rec[k]);
      const rowCls = 'field-row' + (isP ? ' priority' : '');
      const vCls = 'field-val' + (complex ? ' complex' : '');
      const copyAttr = complex ? '' : ' data-copy="'+esc(rawVal(rec[k]))+'"';
      return '<div class="'+rowCls+'">'
        + '<div class="field-key">'+esc(k)+'</div>'
        + '<div class="'+vCls+'"'+copyAttr+'>' + renderValue(rec[k]) + '</div>'
        + '</div>';
    }).join('');

    const label = total > 1 ? 'RECORD '+(idx+1)+'/'+total : 'RECORD';
    const src = rec.source ? '<span class="source-badge">'+esc(rec.source)+'</span>' : '';
    const copyJson = esc(JSON.stringify(rec, null, 2));

    return '<div class="record">'
      + '<div class="record-head">'
      + '<span class="badge">'+label+'</span>'
      + src
      + '<button class="copy-btn" data-copy-btn="'+copyJson+'">COPY JSON</button>'
      + '</div>'
      + '<div class="fields">'+rows+'</div>'
      + '</div>';
  }

  function renderConsensus(c) {
    if (!c || !c.mobile_number) return '';
    const unan = c.unanimous
      ? '<span class="c-unanimous">◆ UNANIMOUS</span>'
      : c.votes+'/'+c.sources_total+' agree';
    return '<div class="consensus">'
      + '<span class="c-label">Consensus</span>'
      + '<span class="c-value" data-copy="'+esc(c.mobile_number)+'">'+esc(c.mobile_number)+'</span>'
      + '<span class="c-votes">'+unan+'</span>'
      + '</div>';
  }

  function renderStats(broker) {
    if (!broker || !Object.keys(broker).length) return '';
    const items = [];
    if (broker.req_left != null && broker.req_total != null) {
      const pct = Math.min(100, (broker.req_left / broker.req_total) * 100);
      items.push('<div class="stat accent">'
        + '<span class="stat-label">Requests</span>'
        + '<span class="stat-value">'+broker.req_left+'<span style="color:var(--text-3);font-size:13px;font-weight:400">/'+broker.req_total+'</span></span>'
        + '<div class="progress"><div class="progress-bar" style="width:'+pct+'%"></div></div>'
        + '</div>');
    }
    if (broker.expiry) items.push('<div class="stat cyan"><span class="stat-label">Expiry</span><span class="stat-value">'+esc(broker.expiry)+'</span></div>');
    if (broker.status) items.push('<div class="stat"><span class="stat-label">Status</span><span class="stat-value">'+esc(broker.status)+'</span></div>');
    if (broker.cached != null) items.push('<div class="stat '+(broker.cached?'warn':'')+'"><span class="stat-label">Cached</span><span class="stat-value">'+(broker.cached?'YES':'NO')+'</span></div>');
    if (broker.success != null) items.push('<div class="stat '+(broker.success?'accent':'warn')+'"><span class="stat-label">Success</span><span class="stat-value">'+(broker.success?'TRUE':'FALSE')+'</span></div>');
    if (broker.response_time) items.push('<div class="stat cyan"><span class="stat-label">Response</span><span class="stat-value">'+esc(broker.response_time)+'</span></div>');
    if (broker.response_time_seconds != null) items.push('<div class="stat"><span class="stat-label">Seconds</span><span class="stat-value">'+broker.response_time_seconds+'s</span></div>');
    if (!items.length) {
      Object.entries(broker).forEach(([k,v]) => {
        if (isComplex(v)) return;
        items.push('<div class="stat"><span class="stat-label">'+esc(k)+'</span><span class="stat-value">'+esc(rawVal(v))+'</span></div>');
      });
    }
    return items.length ? '<div class="stats-strip">'+items.join('')+'</div>' : '';
  }

  function highlightJson(obj) {
    let j = JSON.stringify(obj, null, 2)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return j.replace(
      /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
      function(m) {
        let c = 'j-num';
        if (/^"/.test(m)) c = /:$/.test(m) ? 'j-key' : 'j-str';
        else if (/true|false/.test(m)) c = 'j-bool';
        else if (/null/.test(m)) c = 'j-null';
        return '<span class="'+c+'">'+m+'</span>';
      }
    );
  }

  function renderRaw(data) {
    const json = esc(JSON.stringify(data, null, 2));
    return '<div class="raw" id="rawSec">'
      + '<div class="raw-head" id="rawHead">'
      + '<span class="raw-title">RAW RESPONSE</span>'
      + '<button class="copy-btn" data-copy-btn="'+json+'" style="margin-left:auto;margin-right:10px">COPY</button>'
      + '<span class="raw-toggle">[ expand ]</span>'
      + '</div>'
      + '<div class="raw-body"><pre>'+highlightJson(data)+'</pre></div>'
      + '</div>';
  }

  function renderError(msg, status, extra) {
    let h = '<div class="error-box"><div class="err-title">✕ REQUEST FAILED</div>'+esc(msg);
    if (status) h += '<br><br><span style="color:var(--text-3)">HTTP '+esc(String(status))+'</span>';
    if (extra) h += '<br><span style="color:var(--text-3)">'+esc(extra)+'</span>';
    return h + '</div>';
  }

  function renderResult(data, query, cacheTs) {
    let h = '';

    if (data.consensus) h += renderConsensus(data.consensus);

    let records = [];
    if (Array.isArray(data.records) && data.records.length) records = data.records;
    else if (data.record) records = [data.record];

    if (records.length) {
      h += '<div class="records">' + records.map(function(r,i){ return renderRecord(r,i,records.length); }).join('') + '</div>';
    } else if (data.ok && !data.error) {
      h += '<div class="empty"><span class="glyph">∅</span>no records returned for this query</div>';
    }

    if (data.broker) h += renderStats(data.broker);

    if (data.error) {
      h += '<div style="margin-top:14px">' + renderError(data.error, data.ok===false?402:null) + '</div>';
    }

    h += renderRaw(data);
    return h;
  }

  document.addEventListener('click', async function(e) {
    const t = e.target;
    if (!(t instanceof HTMLElement)) return;

    const copyBtn = t.closest('[data-copy-btn]');
    if (copyBtn) {
      const val = copyBtn.getAttribute('data-copy-btn');
      const ok = await copy(val);
      if (ok) {
        const orig = copyBtn.textContent;
        copyBtn.classList.add('copied');
        copyBtn.textContent = '✓ COPIED';
        setTimeout(function() {
          copyBtn.classList.remove('copied');
          copyBtn.textContent = orig;
        }, 1200);
        toast('copied to clipboard');
      } else toast('copy failed', true);
      return;
    }

    const cell = t.closest('[data-copy]');
    if (cell && !cell.classList.contains('complex')) {
      const val = cell.getAttribute('data-copy');
      if (!val) return;
      const ok = await copy(val);
      if (ok) {
        cell.classList.add('copied');
        setTimeout(function(){ cell.classList.remove('copied'); }, 400);
        toast('copied: ' + (val.length > 36 ? val.slice(0,36)+'…' : val));
      } else toast('copy failed', true);
    }
  });

  document.addEventListener('click', function(e) {
    const head = e.target.closest('#rawHead');
    if (!head) return;
    if (e.target.closest('.copy-btn')) return;
    const sec = head.closest('.raw');
    sec.classList.toggle('open');
    const tog = head.querySelector('.raw-toggle');
    if (tog) tog.textContent = sec.classList.contains('open') ? '[ collapse ]' : '[ expand ]';
  });

  async function doLookup(forceFresh) {
    if (loading) return;
    const raw = inputEl.value.trim();
    const cfg = TYPES[currentType];

    if (!raw) { toast('enter a query first', true); inputEl.focus(); return; }

    const query = cfg.upper ? raw.toUpperCase() : raw;
    if (!cfg.pattern.test(query)) {
      toast('invalid format for ' + cfg.label, true);
      panelBody.innerHTML = renderError('query does not match '+cfg.label+' format', 400, 'expected: ' + cfg.pattern.toString());
      return;
    }

    const ck = cKey(currentType, query);
    const cache = readCache();

    if (!forceFresh && cache[ck]) {
      const entry = cache[ck];
      updateChips(entry.data, query, entry.ts);
      panelBody.innerHTML = renderResult(entry.data, query, entry.ts);
      toast('⚡ loaded from cache · ' + ago(entry.ts));
      return;
    }

    loading = true;
    btnEl.disabled = true;
    resetChips();
    chipType.textContent = cfg.label;
    chipQuery.textContent = 'q=' + query;
    panelBody.innerHTML = '<div class="loading"><div class="loading-text">SCANNING '+esc(cfg.label)+' · '+esc(query)+'</div><div class="loading-bar"></div></div>';

    const url = API + cfg.ep + '?q=' + encodeURIComponent(query);

    try {
      const res = await fetch(url, { method: 'GET', headers: { Accept: 'application/json' } });
      let data;
      try { data = await res.json(); }
      catch (e) { throw new Error('upstream returned unparseable JSON (HTTP ' + res.status + ')'); }

      if (!res.ok && !data.ok) {
        updateChips(data, query, null);
        panelBody.innerHTML = renderResult(data, query, null);
        toast('lookup failed: ' + (data.error || 'HTTP ' + res.status), true);
        pushHist(currentType, query, false, null);
        return;
      }

      const ts = Date.now();
      cache[ck] = { data: data, ts: ts };
      writeCache(cache);

      updateChips(data, query, null);
      panelBody.innerHTML = renderResult(data, query, null);
      const summary = summarize(data);
      toast('lookup complete · ' + (data.record_count != null ? data.record_count + ' record(s)' : 'ok'));
      pushHist(currentType, query, true, summary);

    } catch (err) {
      const msg = (err && err.message) || String(err);
      updateChips({ type: cfg.ep.slice(1) }, query, null);
      panelBody.innerHTML = renderError(msg, null, 'network or API unreachable');
      toast('connection failed', true);
      pushHist(currentType, query, false, null);
    } finally {
      loading = false;
      btnEl.disabled = false;
      inputEl.focus();
      inputEl.select();
    }
  }

  function summarize(d) {
    if (d.consensus && d.consensus.mobile_number) return d.consensus.mobile_number;
    if (d.record) {
      if (d.record.mobile_number) return d.record.mobile_number;
      if (d.record.number) return d.record.number;
      if (d.record.name) return d.record.name;
      if (d.record.tg_id) return d.record.tg_id;
    }
    return null;
  }

  function pushHist(type, query, ok, summary) {
    const h = readHist().filter(function(x){ return !(x.type===type && x.query===query); });
    h.unshift({ type: type, query: query, ok: ok, ts: Date.now(), summary: summary });
    writeHist(h);
    renderHist();
  }

  function renderHist() {
    const h = readHist();
    histCount.textContent = h.length ? '['+h.length+'/'+HMAX+']' : '';
    if (!h.length) {
      histList.innerHTML = '<div class="hist-empty">no history yet — run your first lookup above</div>';
      return;
    }
    histList.innerHTML = h.map(function(it, i) {
      const label = TYPES[it.type] ? TYPES[it.type].label : it.type.toUpperCase();
      const sum = it.summary ? '<span class="arrow">→</span><span class="summary">'+esc(it.summary)+'</span>' : '';
      return '<div class="hist-item" data-idx="'+i+'">'
        + '<span class="hist-type">'+esc(label)+'</span>'
        + '<span class="hist-query">'+esc(it.query)+sum+'</span>'
        + '<span class="hist-status '+(it.ok?'ok':'err')+'">'+(it.ok?'OK':'ERR')+'</span>'
        + '<span class="hist-time">'+fmt(it.ts)+'</span>'
        + '<button class="hist-del" data-del="'+i+'" title="remove">✕</button>'
        + '</div>';
    }).join('');

    histList.querySelectorAll('.hist-del').forEach(function(b) {
      b.addEventListener('click', function(e) {
        e.stopPropagation();
        const arr = readHist();
        arr.splice(parseInt(b.dataset.del, 10), 1);
        writeHist(arr);
        renderHist();
        toast('removed from history');
      });
    });

    histList.querySelectorAll('.hist-item').forEach(function(el) {
      el.addEventListener('click', function() {
        const it = readHist()[parseInt(el.dataset.idx, 10)];
        if (!it) return;
        currentType = it.type;
        renderTabs();
        inputEl.placeholder = TYPES[currentType].ph;
        inputEl.value = it.query;
        doLookup(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  }

  $('btnPurge').addEventListener('click', function() {
    if (!confirm('Purge local cache + history? (server is untouched)')) return;
    localStorage.removeItem(CK);
    localStorage.removeItem(HK);
    renderHist();
    resetChips();
    panelBody.innerHTML = '<div class="empty"><span class="glyph">[ ]</span>cache purged — ready for new queries</div>';
    toast('local cache purged');
  });

  $('btnExport').addEventListener('click', function() {
    const h = readHist();
    if (!h.length) { toast('no history to export', true); return; }
    const blob = new Blob([JSON.stringify(h, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'dz-osint-history-'+Date.now()+'.json';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    toast('history exported');
  });

  btnEl.addEventListener('click', function(){ doLookup(true); });
  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); doLookup(true); }
    if (e.key === 'Escape') { inputEl.value = ''; inputEl.blur(); }
  });
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
      e.preventDefault(); inputEl.focus(); inputEl.select();
    }
  });

  renderTabs();
  renderHist();
  inputEl.placeholder = TYPES[currentType].ph;
  inputEl.focus();
})();
</script>
</body>
</html>
